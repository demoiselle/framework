<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#071421">

{% assign meta_title = page.title | default: site.title %}
{% assign meta_description = page.description | default: site.description %}
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ meta_title | escape }}">
<meta property="og:description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | relative_url }}">

<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/portal.css' | relative_url }}">
<script>
  document.documentElement.classList.add('js');
  try {
    const savedTheme = localStorage.getItem('demoiselle-theme');
    if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  } catch (_) {}
</script>
<script src="{{ '/assets/js/portal.js' | relative_url }}" defer></script>
