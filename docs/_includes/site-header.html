<header class="site-header" data-site-header>
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Demoiselle Framework — início">
      {% include brand-mark.html %}
      <span class="brand-copy">
        <strong>Demoiselle</strong>
        <small>Framework</small>
      </span>
    </a>

    <div class="header-actions">
      <details class="nav-disclosure" data-nav-disclosure>
        <summary aria-label="Abrir navegação">
          <span></span><span></span><span></span>
          <span class="sr-only">Menu</span>
        </summary>
        <nav class="nav-links" aria-label="Navegação principal">
          <a href="{{ '/#valor' | relative_url }}" data-section-link="valor">O que é</a>
          <a href="{{ '/#capacidades' | relative_url }}" data-section-link="capacidades">Funcionalidades</a>
          <a href="{{ '/#arquitetura' | relative_url }}" data-section-link="arquitetura">Arquitetura</a>
          <a href="{{ '/#ecossistema' | relative_url }}" data-section-link="ecossistema">Ecossistema</a>
          <a href="{{ '/#comecar' | relative_url }}" data-section-link="comecar">Começar</a>
          <a href="{{ '/docs/' | relative_url }}">Documentação</a>
          <a class="nav-github" href="{{ site.github_url }}">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </details>

      <button class="theme-toggle js-only" type="button" data-theme-toggle aria-label="Alternar tema" title="Alternar tema">
        <span class="theme-icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </div>
</header>
